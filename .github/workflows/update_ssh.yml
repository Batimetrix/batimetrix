name: Weekly SSH update

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install earthaccess xarray h5netcdf h5py numpy

      - name: Fetch latest NASA-SSH file
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: python fetch_latest_ssh.py

      - name: Build ssh_live.json
        run: python build_ssh_live.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ssh_live.json
          git diff --cached --quiet || (git commit -m "Weekly SSH update (automated)" && git push)
